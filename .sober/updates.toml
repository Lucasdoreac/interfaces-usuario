schema_version = 1
[project]
name = "LabTech Render Staging UI"
authority = "owner"
[policy]
capability = "updates"
version = 1
enabled = true
channel = "stable"
auto_merge_risks = []
auto_deploy_risks = ["LOW", "MEDIUM"]
[policy.limits]
max_concurrent_jobs = 1
max_changed_packages = 10
max_daily_jobs = 5
[gates]
commands = ["python3 ops/staging-release.py gate"]
publish_ci_status = false
[deployment]
artifact_kind = "provider-build"
adapter = "render-staging-ui"
environment = "staging"
# Core names this generic external-effect switch production_enabled; target is fixed to Staging.
production_enabled = true
probes = ["/organizer"]
rollback = "Render rollback to the retained previous Staging static-site deploy ID"

[harness]
repository = "Lucasdoreac/personal-dev-harness"
revision = "41262ba149201d5c3aa54fd758c3af52ef77f971"
source_sha256 = "0de9fa87bf902174fb5ed364175a13a5a83e32fbc3219168e9ae62e59beff77e"
package = "personal-dev-harness-update-vanguard"
path = "ops/vendor/update-vanguard"
